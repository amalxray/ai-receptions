services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env}
      MODEL_PATH: /models/best_model_upgraded.onnx
      MODEL_VERSION: ${MODEL_VERSION:-yolov8l-20261011}
      IMAGE_SIZE: "1024"
      ORT_INTRA_OP_THREADS: "2"
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MODEL_CLASS_NAMES_JSON: ${MODEL_CLASS_NAMES_JSON:-}
    volumes:
      - ./models:/models:ro
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 10g
    cpus: 1.75

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AI_DOMAIN: ${AI_DOMAIN:?Set AI_DOMAIN in .env}
    depends_on:
      - inference
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
